version: '3.7'

services:
  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:latest
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog

  kafka:
      container_name: kafka
      image: confluentinc/cp-kafka:latest
      restart: always
      depends_on:
        - zookeeper
      ports:
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_CREATE_TOPICS: "real_estate_topic:1:1,rental_ads:1:1"

      volumes:
        - kafka_data:/var/lib/kafka/data


  clickhouse:
    image: registry.docker.ir/clickhouse/clickhouse-server:latest
    container_name: clickhouse
    hostname: clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./db-init.d:/docker-entrypoint-initdb.d
      - ./clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: airflow
      CLICKHOUSE_PASSWORD: airflow
      CLICKHOUSE_DB: airflow

  airflow-webserver:
    container_name: airflow-webserver
#    image: airflow
    build:
      context: .
      dockerfile: AirflowDockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOGGING_LEVEL: DEBUG
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: 'secret-key'
      PYTHONPATH: /opt/airflow/
    depends_on:
      - postgres
      - kafka
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scraper:/opt/airflow/scraper
      - ./data:/home/airflow/data
      - ./kafka_producer:/opt/airflow/kafka_producer
      - ./kafka_consumer:/opt/airflow/kafka_consumer
      - ./plugins:/opt/airflow/plugins
    command: webserver

  airflow-scheduler:
    privileged: true
    container_name: airflow-scheduler
#    image: airflow
    build:
      context: .
      dockerfile: AirflowDockerfile
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOGGING_LEVEL: DEBUG
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: 'secret-key'
      PYTHONPATH: /opt/airflow/
    depends_on:
      - postgres
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scraper:/opt/airflow/scraper
      - ./data:/home/airflow/data
      - ./kafka_producer:/opt/airflow/kafka_producer
      - ./kafka_consumer:/opt/airflow/kafka_consumer
      - ./plugins:/opt/airflow/plugins
    command: scheduler

  postgres:
    container_name: airflow-postgres
    image: registry.docker.ir/postgres:12
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: registry.docker.ir/metabase/metabase:latest
    container_name: metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
#      MB_DB_TYPE: clickhouse
      MB_DB_HOST: clickhouse
      MB_DB_DBNAME: airflow
      MB_DB_PORT: 8123
      MB_DB_USER: airflow
      MB_DB_PASS: airflow
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - ./clickhouse_jdbc:/plugins
      - ./metabase-data:/metabase-data

  kafka-ui:
    image: registry.docker.ir/provectuslabs/kafka-ui
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "7777:8080"
    restart: always
    environment:
      - KAFKA_CLUSTERS_0_NAME=kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

  kafka-consumer:
    container_name: kafka-consumer
    build:
      context: .
      dockerfile: KafkaConsumerDockerfile
    restart: always
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scraper:/opt/airflow/scraper
      - ./data:/home/airflow/data
      - ./kafka_producer:/opt/airflow/kafka_producer
      - ./kafka_consumer:/opt/airflow/kafka_consumer
      - ./plugins:/opt/airflow/plugins
    command: python /opt/airflow/kafka_consumer/kafka_clickhouse_consumer.py
    depends_on:
      - kafka

volumes:
  postgres_data:
  kafka_data:
    driver: local
  zookeeper_data:
  zookeeper_datalog: